name: Build Av1an Static Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Forces Rust to link the C runtime library statically
      RUSTFLAGS: "-C target-feature=+crt-static"

    steps:
      # 1. Pull the official upstream Av1an source repository
      - name: Checkout Av1an Source
        uses: actions/checkout@v4
        with:
          repository: 'rust-av/Av1an'
          path: 'av1an-source'

      # 2. Clone VapourSynth core repository just to get the required development headers
      - name: Checkout VapourSynth Headers Source
        uses: actions/checkout@v4
        with:
          repository: 'vapoursynth/vapoursynth'
          path: 'vapoursynth-src'
          ref: 'R65' # Matches the baseline API target

      # 3. Setup the Rust toolchain targeting Windows MSVC
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 4. Cache Rust Build Dependencies to speed up future workflow runs
      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'av1an-source -> target'

      # 5. Compile the Av1an binary in production Release mode
      # Overrides the header lookups directly using local system variables
      - name: Build Av1an Binary
        shell: powershell
        env:
          VAPOURSYNTH_INCLUDE_DIR: ${{ github.workspace }}\vapoursynth-src\include
        run: |
          cd av1an-source
          cargo build --release --bin av1an

      # 6. Gather the compiled standalone executable into a distribution directory
      - name: Stage Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\dist
          Copy-Item .\av1an-source\target\release\av1an.exe .\dist\
          Copy-Item .\av1an-source\README.md .\dist\

      # 7. Securely pack and grab the single finalized static executable folder
      - name: Upload Windows App Binary
        uses: actions/upload-artifact@v4
        with:
          name: Av1an_Static_Windows_x64
          path: dist/
          if-no-files-found: error
