name: Build Av1an HDR Metadata Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Forces Rust to link the C runtime library (MSVCRT) statically into the binary
      RUSTFLAGS: "-C target-feature=+crt-static"

    steps:
      # 1. Pull the official main fork tree to ensure stable baseline checks
      - name: Checkout Av1an Core Source
        uses: actions/checkout@v4
        with:
          repository: 'master-of-zen/Av1an'
          path: 'av1an-source'

      # 2. Checkout VapourSynth SDK mapping components
      - name: Checkout VapourSynth Build SDK Dependencies
        uses: actions/checkout@v4
        with:
          repository: 'vapoursynth/vapoursynth'
          path: 'vs-sdk'
          ref: 'R65'
          sparse-checkout: |
            include
            msvc_project

      # 3. Setup the Rust toolchain targeting Windows MSVC
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 4. Cache Rust Build Dependencies to speed up future workflow runs
      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'av1an-source -> target'

      # 5. Compile the static Av1an binary
      - name: Build Av1an Binary
        shell: powershell
        env:
          VAPOURSYNTH_INCLUDE_DIR: ${{ github.workspace }}\vs-sdk\include
          VAPOURSYNTH_LIBRARIES: ${{ github.workspace }}\vs-sdk\msvc_project
        run: |
          cd av1an-source
          cargo build --release --bin av1an

      # 6. Create the distribution folder and gather mkvmerge portable bin
      - name: Fetch mkvmerge portable bin
        shell: powershell
        run: |
          # Create output directory first to prevent extraction failure
          New-Item -ItemType Directory -Force -Path .\dist
          
          Invoke-WebRequest -Uri "https://mkvtoolnix.download" -OutFile "mkvtoolnix.7z"
          & "C:\Program Files\7-Zip\7z.exe" e mkvtoolnix.7z "mkvtoolnix\mkvmerge.exe" -o"dist"

      # 7. Stage finalized toolkit folder components
      - name: Stage Toolkit Artifacts
        shell: powershell
        run: |
          Copy-Item .\av1an-source\target\release\av1an.exe .\dist\
          Copy-Item .\av1an-source\README.md .\dist\

      # 8. Upload the working HDR-ready tool bundle
      - name: Upload Windows App Binary
        uses: actions/upload-artifact@v4
        with:
          name: Av1an_HDR_Metadata_Windows_x64
          path: dist/
          if-no-files-found: error
