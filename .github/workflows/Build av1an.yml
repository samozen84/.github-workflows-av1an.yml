name: Build Av1an Static Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Forces Rust to link the C runtime library statically
      RUSTFLAGS: "-C target-feature=+crt-static"

    steps:
      # 1. Pull the official upstream Av1an source repository
      - name: Checkout Av1an Source
        uses: actions/checkout@v4
        with:
          repository: 'rust-av/Av1an'
          path: 'av1an-source'

      # 2. Extract portable VapourSynth SDK headers and link libraries cleanly
      - name: Install VapourSynth Headers
        shell: powershell
        run: |
          # Download official R65 portable build
          Invoke-WebRequest -Uri "https://github.com" -OutFile "vs.7z"
          
          # Extract with built-in 7-Zip on Windows runner
          & "C:\Program Files\7-Zip\7z.exe" x vs.7z -o"C:\vapoursynth"
          
          # Force export paths directly to GitHub Action environment states
          echo "VAPOURSYNTH_LIBRARIES=C:\vapoursynth\sdk\lib64" >> $env:GITHUB_ENV
          echo "C:\vapoursynth" >> $env:GITHUB_PATH
          echo "C:\vapoursynth\sdk\lib64" >> $env:GITHUB_PATH

      # 3. Setup the Rust toolchain targeting Windows MSVC
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 4. Cache Rust Build Dependencies to speed up future workflow runs
      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'av1an-source -> target'

      # 5. Compile the Av1an binary in production Release mode
      - name: Build Av1an Binary
        shell: powershell
        run: |
          cd av1an-source
          cargo build --release --bin av1an

      # 6. Gather the compiled standalone executable into a distribution directory
      - name: Stage Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\dist
          Copy-Item .\av1an-source\target\release\av1an.exe .\dist\
          Copy-Item .\av1an-source\README.md .\dist\

      # 7. Securely pack and grab the single finalized static executable folder
      - name: Upload Windows App Binary
        uses: actions/upload-artifact@v4
        with:
          name: Av1an_Static_Windows_x64
          path: dist/
          if-no-files-found: error
